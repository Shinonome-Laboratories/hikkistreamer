services:
  app:
    build: .
    ports:
      - "3001:3001"
    # Persistent data (SQLite DB, avatars, emojis, uploads) is stored in ./data,
    # relative to this compose file, so it lives on the host next to the repo.
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
